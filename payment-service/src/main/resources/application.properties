# ── APPLICATION ───────────────────────────────────────────────
spring.application.name=payment-service
server.port=8084

# ── TOMCAT THREAD POOL ────────────────────────────────────────
# Payment Service is called synchronously by Booking Service as part of the
# booking Saga — every concurrent booking holds a Payment Service thread for
# the full charge duration (DB writes + gateway call). Under flash-sale load
# with 100+ concurrent bookings, the pool must accommodate all concurrent
# inbound charge requests without queuing at the HTTP accept layer.
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=100
server.tomcat.connection-timeout=30s
server.tomcat.accept-count=200

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

stagepass.payment.idempotency-ttl-hours=1


# ── DATABASE ───────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment-service-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── FLYWAY ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── REDIS (CACHE) ──────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── KAFKA ──────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── EUREKA ─────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# ── ACTUATOR ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ── DISTRIBUTED TRACING (ZIPKIN) ─────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── LOGGING FORMAT ───────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n
logging.level.org.stagepass=INFO

# ── KAFKA OBSERVABILITY ──────────────────────────────────────────────────────
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true