# ── APPLICATION ───────────────────────────────────────────────
spring.application.name=event-service
server.port=8082

# ── TOMCAT THREAD POOL ────────────────────────────────────────
# Must handle concurrent seat validation requests from booking-service during
# flash sales. 100+ VUs hitting /seats/validate simultaneously.
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=100
server.tomcat.connection-timeout=30s
server.tomcat.accept-count=200

# ── DATABASE ───────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event-service-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── FLYWAY ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── REDIS (CACHE) ──────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ── KAFKA ──────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer

# Consumer
spring.kafka.consumer.group-id=event-service-group


# ── EUREKA ─────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# ── ACTUATOR ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ── LOGGING ─────────────────────────────────────────────────────
logging.level.org.springframework=INFO
logging.level.com.example=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n

# ── DISTRIBUTED TRACING (ZIPKIN) ─────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── KAFKA OBSERVABILITY ──────────────────────────────────────────────────────
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
