# ── APPLICATION ───────────────────────────────────────────────
spring.application.name=booking-service
server.port=8083

stagepass.booking.cancellation-cutoff-days=1
stagepass.booking.seat-lock-ttl-seconds=600

# ── DATABASE ───────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking-service-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── FLYWAY ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── REDIS (CACHE) ──────────────────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.key-prefix=seat:lock:

# ── KAFKA ──────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer

# Consumer
spring.kafka.consumer.group-id=booking-service-group

# ── EUREKA ─────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# ── FEIGN ───────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# Enable circuit breaker for Feign clients
spring.cloud.openfeign.circuitbreaker.enabled=true
# Ensure fallback is used for all exceptions (including service discovery errors)
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

# ── RESILIENCE4J ─────────────────────────────────────────────────
# Circuit Breaker for the payment-service: open when failure rate >= 30%,
# remain open for 60s before transitioning to half-open. Other sensible
# defaults are provided (count-based sliding window, minimum calls, etc.).
resilience4j.circuitbreaker.instances.payment-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.payment-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=100
resilience4j.circuitbreaker.instances.payment-service.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=30
resilience4j.circuitbreaker.instances.payment-service.event-consumer-buffer-size=10

# ── RESILIENCE4J TIME LIMITER (TIMEOUTS) ─────────────────────────
# Increase default time limiter timeout (default is 1s) to allow slow downstream
# payment captures or event fetches to complete successfully without fallback triggers.
resilience4j.timelimiter.configs.default.timeout-duration=15s

# ── ACTUATOR ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ── DISTRIBUTED TRACING (ZIPKIN) ─────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── LOGGING FORMAT ───────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n

# ── KAFKA OBSERVABILITY ──────────────────────────────────────────────────────
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true