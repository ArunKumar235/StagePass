# ── APPLICATION ───────────────────────────────────────────────
spring.application.name=booking-service
server.port=8083

stagepass.booking.cancellation-cutoff-days=1
stagepass.booking.seat-lock-ttl-seconds=600

# ── TOMCAT THREAD POOL ────────────────────────────────────────
# Generous limits to handle flash-sale concurrency (100+ simultaneous bookings).
# Each booking holds a thread for the full Saga duration (3-15s), so the pool
# must be large enough to avoid request queuing under load.
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=100
server.tomcat.connection-timeout=30s
server.tomcat.accept-count=200

# ── DATABASE ───────────────────────────────────────────────────
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/booking-service-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# ── JPA ────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── FLYWAY ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── REDIS (CACHE + SEAT LOCKS) ───────────────────────────────────
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.redis.key-prefix=seat:lock:

# Command timeout: how long Lettuce waits for a Redis reply before throwing
# QueryTimeoutException. Default is no timeout (waits forever), which causes
# silent hangs under high concurrency. 3s gives Redis ample time to respond
# while failing fast enough to not block Tomcat threads indefinitely.
spring.data.redis.timeout=3000ms

# Lettuce connection pool (requires commons-pool2 on classpath — added to pom.xml).
# Without pooling, ALL concurrent Redis commands share a single multiplexed
# connection. Under 100 simultaneous SETNX seat-lock calls, the single
# connection's socket buffer saturates → QueryTimeoutException.
# max-active=50 matches the booking-service HikariCP pool size so that each
# thread that holds a DB connection can also hold a Redis connection.
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000ms

# ── KAFKA ──────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer

# Consumer
spring.kafka.consumer.group-id=booking-service-group

# ── EUREKA ─────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# ── FEIGN ───────────────────────────────────────────────────────
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=25000

# Apache HttpClient 5 connection pool for Feign.
# Default Feign client (java.net.HttpURLConnection) creates a new TCP socket per
# request — no pooling. Under 100-VU flash-sale load, this causes a connection
# storm: 100 simultaneous TCP handshakes to event-service add 5-15s of latency.
# HC5 maintains a pool of keep-alive connections, so concurrent Feign calls reuse
# existing sockets instead of opening new ones.
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.httpclient.max-connections=200
spring.cloud.openfeign.httpclient.max-connections-per-route=200

# Enable circuit breaker for Feign clients
spring.cloud.openfeign.circuitbreaker.enabled=true
# Ensure fallback is used for all exceptions (including service discovery errors)
spring.cloud.openfeign.circuitbreaker.alphanumeric-ids.enabled=true

# Align Resilience4j Circuit Breaker TimeLimiter timeout with Feign read timeout
spring.cloud.circuitbreaker.resilience4j.config.default.time-limiter-properties.timeout-duration=30s

# ── RESILIENCE4J ─────────────────────────────────────────────────
# Circuit Breaker for the payment-service: tuned for high-concurrency simulation.
# We increase minimum calls and failure rate threshold to prevent JIT warm-up transients
# from tripping the circuit open prematurely during the load test.
resilience4j.circuitbreaker.instances.payment-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.payment-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size=100
resilience4j.circuitbreaker.instances.payment-service.minimum-number-of-calls=100
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold=95
resilience4j.circuitbreaker.instances.payment-service.event-consumer-buffer-size=10

# ── RESILIENCE4J TIME LIMITER (TIMEOUTS) ─────────────────────────
# Generous time limiter to allow downstream calls (payment captures, event
# validation) to complete under heavy concurrent load without premature fallback.
resilience4j.timelimiter.configs.default.timeout-duration=30s

# ── ACTUATOR ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ── DISTRIBUTED TRACING (ZIPKIN) ─────────────────────────────────────────────
management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── LOGGING FORMAT ───────────────────────────────────────────────────────────
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n

# ── KAFKA OBSERVABILITY ──────────────────────────────────────────────────────
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true