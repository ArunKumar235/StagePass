# ── APPLICATION ─────────────────────────────────────────────
spring.application.name=user-service

server.port=8081
server.forward-headers-strategy=FRAMEWORK

# ── TOMCAT THREAD POOL ────────────────────────────────────────
# Generous limits for concurrent auth operations (100+ register/login during
# benchmark setup and JWT validation during booking rush).
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=100
server.tomcat.connection-timeout=30s
server.tomcat.accept-count=200

# ── DATA SOURCE ──────────────────────────────────────────────

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/user-service-db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}

# ── JPA ────────────────────────────────────────────────────────

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── FLYWAY ─────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── SECURITY ───────────────────────────────────────────────────────────

app.oauth2.callback-path=${APP_OAUTH2_CALLBACK_PATH:http://localhost:8080/auth/index.html}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/github


# ── EUREKA CLIENT ───────────────────────────────────────────────────────────

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# ── JWT ───────────────────────────────────────────────────────────

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}


# ── KAFKA ───────────────────────────────────────────────────────────

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# PRODUCER

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── ACTUATOR ───────────────────────────────────────────────────

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

# ── DISTRIBUTED TRACING (ZIPKIN) ─────────────────────────────────────────────

management.tracing.sampling.probability=1.0
management.tracing.export.zipkin.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# ── LOGGING FORMAT ───────────────────────────────────────────────────────────

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - traceId=%X{traceId} spanId=%X{spanId} - %msg%n
logging.level.org.stagepass=INFO

# ── KAFKA OBSERVABILITY ──────────────────────────────────────────────────────

spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true

